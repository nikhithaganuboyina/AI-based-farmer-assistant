<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ text.market }}</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:url("{{ url_for('static', filename='images/market.jpg') }}") no-repeat center/cover;
}

.overlay{
min-height:100vh;
background:rgba(0,0,0,0.35);
padding:40px 20px;
}

.market-box{
max-width:1000px;
margin:auto;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(10px);
border-radius:25px;
padding:35px;
color:#fff;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h2{
font-size:32px;
margin-bottom:10px;
}

.header p{
opacity:0.9;
}

.center{
text-align:center;
}

input{
padding:12px 18px;
border:none;
border-radius:25px;
width:70%;
max-width:350px;
outline:none;
font-size:15px;
margin-bottom:15px;
}

.loc-btn{
padding:12px 28px;
border:none;
border-radius:25px;
background:#2ecc71;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

.loc-btn:hover{
background:#27ae60;
transform:scale(1.05);
}

.market-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-top:35px;
}

.market-card{
background:rgba(0,0,0,0.45);
padding:20px;
border-radius:18px;
transition:0.3s;
}

.market-card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.market-card h4{
margin-bottom:10px;
font-size:18px;
color:#2ecc71;
}

.market-card p{
font-size:14px;
margin-bottom:5px;
opacity:0.9;
}

.loading{
text-align:center;
margin-top:25px;
font-size:18px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="market-box">

<!-- Header -->

<div class="header">
<h2>🏪 {{ text.market }}</h2>
<p>{{ text.market_desc }}</p>
</div>

<!-- Search Box -->

<div class="center">

<input type="text" id="placeName" placeholder="Enter place name">

<br>

<button class="loc-btn" onclick="searchPlaceMarkets()">
🔍 Search OpenStreetMap
</button>

<div style="margin: 20px 0; font-size: 14px; opacity: 0.8;">— OR —</div>

<button class="loc-btn" style="background:#3498db;" onclick="findMyMarkets()">
📍 Find My Nearby Markets
</button>

</div>

<!-- Nearby Markets -->

<div class="market-list" id="marketList"></div>

<div class="loading" id="loading"></div>

</div>
</div>

<script>

/* GEOLOCATION + LOCAL DATABASE */

async function findMyMarkets() {
    const marketList = document.getElementById("marketList");
    const loading = document.getElementById("loading");

    if (!navigator.geolocation) {
        loading.innerHTML = "❌ Geolocation is not supported by your browser";
        return;
    }

    marketList.innerHTML = "";
    loading.innerHTML = "📍 Getting your location...";

    navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        
        loading.innerHTML = "🌾 Finding nearby markets...";

        try {
            const res = await fetch(`/get-nearby-markets?lat=${lat}&lng=${lon}`);
            const data = await res.json();
            
            loading.innerHTML = "";

            if (data.error || data.length === 0) {
                loading.innerHTML = "❌ No markets found nearby";
                return;
            }

            data.forEach(m => {
                const div = document.createElement("div");
                div.className = "market-card";
                div.innerHTML = `
                <h4>${m.market_name}</h4>
                <p><strong>District:</strong> ${m.district}, ${m.state}</p>
                <p><strong>Distance:</strong> ${m.distance_km} km</p>
                <a href="https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}" target="_blank" style="color:#2ecc71; text-decoration:none; display:inline-block; margin-top:10px;">📌 View on Map</a>
                `;
                marketList.appendChild(div);
            });

        } catch (error) {
            loading.innerHTML = "⚠️ Error fetching markets";
            console.error(error);
        }
    }, () => {
        loading.innerHTML = "❌ Location access denied. Please allow location access.";
    });
}

/* SEARCH MARKETS BY PLACE (OPENSTREETMAP) */

async function searchPlaceMarkets(){
    const place = document.getElementById("placeName").value.trim();
    const marketList = document.getElementById("marketList");
    const loading = document.getElementById("loading");

    if(!place){
        alert("Please enter a place name");
        return;
    }

    marketList.innerHTML = "";
    loading.innerHTML = `🌾 Searching agricultural markets for "${place}"...`;

    try {
        const res = await fetch(`/search-place-markets?place=${encodeURIComponent(place)}`);
        const data = await res.json();

        loading.innerHTML = "";

        if(!data || !Array.isArray(data) || data.length === 0){
            loading.innerHTML = `❌ No nearby agricultural markets found for "${place}"`;
            return;
        }

        data.forEach(m => {
            const div = document.createElement("div");
            div.className = "market-card";
            const distText = (typeof m.distance_km === 'number') ? `${m.distance_km} km` : m.distance_km;
            div.innerHTML = `
            <h4>${m.market_name}</h4>
            <p><strong>District:</strong> ${m.district}, ${m.state}</p>
            <p><strong>Address:</strong> ${m.address}</p>
            ${distText ? `<p><strong>Distance:</strong> ${distText}</p>` : ''}
            <a href="https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}" target="_blank" style="color:#2ecc71; text-decoration:none; display:inline-block; margin-top:10px; font-weight:600;">📌 View on Map &rarr;</a>
            `;
            marketList.appendChild(div);
        });
    } catch(err) {
        loading.innerHTML = "⚠️ Error fetching markets. Please try again.";
        console.error("Market search error:", err);
    }
}

</script>

</body>
</html>
